<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
	<head>
		<title>Home</title>
		<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
		<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
	</head>
	<body>
		<div class="color page">
            <div class="chat-grid">
                <div class="header-1"></div>
                <div class="header-2">
                    <div id="search-container" class="search-container">
                        <div class="search-dropdown" >
                            <input class="search-input" type="search" id="search-input" placeholder="Search">
                            <div class="results" id="search-results"></div>
                        </div>
                        <button id="search-button" class="neon-box standard-button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        </button>
                    </div>
                </div>
                <div class="header-3"></div>
                <div class="conversations padding">
                    <div class="scrollable-list padding">
						<div class="column" id="conversation-list">
							<th:block th:fragment="conversationList">
								<th:block th:each="conversation : ${conversations}">
									<button class="neon-box conversation-button" th:data-id="${conversation.id}">
										<div class="system-text" th:text="${conversation.title}">Title</div>
										<div class="system-text-minor" th:text="${#temporals.format(conversation.lastSent, 'dd/MM/yy hh:mm a')}">
										Timestamp</div>
									</button>
								</th:block>
							</th-block>
						</div>
                    </div>
                </div>
                <div class="chat padding">
					<div class="scrollable-list padding" id="chat-scroll">
						<div class="system-text" id="loading" hidden>Loading...</div>
						<div class="column" id="message-list">
							<th:block th:fragment="messageList">
								<p class="system-text" th:if="${messages == null}">Select a conversation</p>
								<div th:each="message : ${messages}" class="message-wrapper" th:data-id="${message.id}" th:data-sent-at="${message.sentAt}">
									<div class="time" th:classappend="${message.accountId == userId} ? 'time--out' : 'time--in'">
										<small th:text="${#temporals.format(message.sentAt, 'dd/MM/yy, hh:mm a') + (message.edited ? ' edited' : '')}"></small>
									</div>
									<div class="message" th:classappend="${message.accountId == userId} ? 'message--out' : 'message--in'">
										<button th:if="${message.accountId == userId}" class="edit-message">
											<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21.2799 6.40005L11.7399 15.94C10.7899 16.89 7.96987 17.33 7.33987 16.7C6.70987 16.07 7.13987 13.25 8.08987 12.3L17.6399 2.75002C17.8754 2.49308 18.1605 2.28654 18.4781 2.14284C18.7956 1.99914 19.139 1.92124 19.4875 1.9139C19.8359 1.90657 20.1823 1.96991 20.5056 2.10012C20.8289 2.23033 21.1225 2.42473 21.3686 2.67153C21.6147 2.91833 21.8083 3.21243 21.9376 3.53609C22.0669 3.85976 22.1294 4.20626 22.1211 4.55471C22.1128 4.90316 22.0339 5.24635 21.8894 5.5635C21.7448 5.88065 21.5375 6.16524 21.2799 6.40005V6.40005Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M11 4H6C4.93913 4 3.92178 4.42142 3.17163 5.17157C2.42149 5.92172 2 6.93913 2 8V18C2 19.0609 2.42149 20.0783 3.17163 20.8284C3.92178 21.5786 4.93913 22 6 22H17C19.21 22 20 20.2 20 18V13" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
										</button>
										<p th:text="${message.contents}">Message</p>
									</div>
								</div>
							</th:block>
						</div>
					</div>
                </div>
                <div class="send padding">
					<div class="send-wrapper padding-horizontal"> 
						<input type="text" id="message-input" name="contents" placeholder="Send a message">
						<button id="message-button" class="neon-box standard-button">
							<svg viewBox="0 0 24 24" fill="none"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M19.1168 12.1484C19.474 12.3581 19.9336 12.2384 20.1432 11.8811C20.3528 11.5238 20.2331 11.0643 19.8758 10.8547L19.1168 12.1484ZM6.94331 4.13656L6.55624 4.77902L6.56378 4.78344L6.94331 4.13656ZM5.92408 4.1598L5.50816 3.5357L5.50816 3.5357L5.92408 4.1598ZM5.51031 5.09156L4.76841 5.20151C4.77575 5.25101 4.78802 5.29965 4.80505 5.34671L5.51031 5.09156ZM7.12405 11.7567C7.26496 12.1462 7.69495 12.3477 8.08446 12.2068C8.47397 12.0659 8.67549 11.6359 8.53458 11.2464L7.12405 11.7567ZM19.8758 12.1484C20.2331 11.9388 20.3528 11.4793 20.1432 11.122C19.9336 10.7648 19.474 10.6451 19.1168 10.8547L19.8758 12.1484ZM6.94331 18.8666L6.56375 18.2196L6.55627 18.2241L6.94331 18.8666ZM5.92408 18.8433L5.50815 19.4674H5.50815L5.92408 18.8433ZM5.51031 17.9116L4.80505 17.6564C4.78802 17.7035 4.77575 17.7521 4.76841 17.8016L5.51031 17.9116ZM8.53458 11.7567C8.67549 11.3672 8.47397 10.9372 8.08446 10.7963C7.69495 10.6554 7.26496 10.8569 7.12405 11.2464L8.53458 11.7567ZM19.4963 12.2516C19.9105 12.2516 20.2463 11.9158 20.2463 11.5016C20.2463 11.0873 19.9105 10.7516 19.4963 10.7516V12.2516ZM7.82931 10.7516C7.4151 10.7516 7.07931 11.0873 7.07931 11.5016C7.07931 11.9158 7.4151 12.2516 7.82931 12.2516V10.7516ZM19.8758 10.8547L7.32284 3.48968L6.56378 4.78344L19.1168 12.1484L19.8758 10.8547ZM7.33035 3.49414C6.76609 3.15419 6.05633 3.17038 5.50816 3.5357L6.34 4.78391C6.40506 4.74055 6.4893 4.73863 6.55627 4.77898L7.33035 3.49414ZM5.50816 3.5357C4.95998 3.90102 4.67184 4.54987 4.76841 5.20151L6.25221 4.98161C6.24075 4.90427 6.27494 4.82727 6.34 4.78391L5.50816 3.5357ZM4.80505 5.34671L7.12405 11.7567L8.53458 11.2464L6.21558 4.83641L4.80505 5.34671ZM19.1168 10.8547L6.56378 18.2197L7.32284 19.5134L19.8758 12.1484L19.1168 10.8547ZM6.55627 18.2241C6.4893 18.2645 6.40506 18.2626 6.34 18.2192L5.50815 19.4674C6.05633 19.8327 6.76609 19.8489 7.33035 19.509L6.55627 18.2241ZM6.34 18.2192C6.27494 18.1759 6.24075 18.0988 6.25221 18.0215L4.76841 17.8016C4.67184 18.4532 4.95998 19.1021 5.50815 19.4674L6.34 18.2192ZM6.21558 18.1667L8.53458 11.7567L7.12405 11.2464L4.80505 17.6564L6.21558 18.1667ZM19.4963 10.7516H7.82931V12.2516H19.4963V10.7516Z" fill="#ffffff"></path> </g></svg>
						</button>
					</div>
					<div class="padding-horizontal">
						<p id="message-error" class="error-message" hidden>Message exceeded 1000 bytes</p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
<script type="module" defer>
	import { fetchConversation, fetchMessages, fetchOlderMessages, fetchUserId, fetchAccounts } from "/js/api.js";
	import { buildHTML, createText, buildMessage, buildAccountSearchResults, clearSearchResults, hideElement } from "/js/render.js";
	import { editIcon, getEncodedText, getJavaTime, shouldSendOnKeydown } from "/js/utilities.js";


	// ==================== VARIABLES ====================	
	let conversationId = null;
	let selectedElement = null;
	let subscription = null;
	let stompClient = null;
	let userId = null;
	let oldestMessageTimestamp = null;
	let oldestMessageId = null;
	let hasOlderMessages = true;
	let scrollHeight = null;
	let loading = false;


	// ==================== DOM ELEMENTS ====================				
	const excludedDiv = document.getElementById("search-container");
	const searchInput = document.getElementById("search-input");
	const searchResults = document.getElementById("search-results");
	const searchButton = document.getElementById("search-button");
	const messageList = document.getElementById("message-list");
	const chatScroll = document.getElementById("chat-scroll");
	const loadingDiv = document.getElementById("loading");
	const messageInput = document.getElementById("message-input");
	const messageButton = document.getElementById("message-button");
	const conversationList = document.getElementById("conversation-list");
	const messageError = document.getElementById("message-error");


	// ==================== LISTENERS ====================
	document.addEventListener("DOMContentLoaded", async () => {
    	userId = await getUserId();
		const conversation = window.location.pathname.match(/\/conversation\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\/messages/);
		if (conversation){
			getMessages(document.querySelector(`[data-id="${conversation[1]}"]`));
		}
	});

	document.addEventListener("click", (event) => {
		if (!excludedDiv.contains(event.target)) {
			clearSearchResults(searchResults, searchInput);
		}
	});

	chatScroll.addEventListener("scroll", async (event) => {
		if (chatScroll.scrollTop == 0 && !loading && hasOlderMessages){
			loading = true;
			scrollHeight = chatScroll.scrollHeight;
			loadingDiv.hidden = false;
			await getOlderMessages();
			loadingDiv.hidden = true;
			chatScroll.scrollTop = chatScroll.scrollHeight - scrollHeight;
			scrollHeight = chatScroll.scrollHeight;
			loading = false;
		}
	});

	const searchForAccounts = async (event) => {
		if (!shouldSendOnKeydown(event)) {
			return
		}
		try {
			const accountsJSON = await fetchAccounts(searchInput.value);
			if (accountsJSON.length == 0) {
				console.log("No accounts found");
				return;
			}
    		buildAccountSearchResults(accountsJSON, searchResults, searchInput);
		}
		catch (error) {
			console.error(error);
		}
	};
	searchButton.addEventListener("click", searchForAccounts);
	searchInput.addEventListener("keydown", searchForAccounts);

	searchResults.addEventListener("click", (event) => {
		const button = event.target.closest("[data-id]");
		if (button) {
			createConversation(button.dataset.id);
		}
	});

	const sendMessage = (event) => {
		if (!messageInput.value || !conversationId || !stompClient || !stompClient.connected || !shouldSendOnKeydown(event)) {
			return;
		}
		if (getEncodedText(messageInput.value).length > 1000) {
			messageError.hidden = false;
			setTimeout(() => hideElement(messageError), 5000);
		}
		const message = {
			conversationId: conversationId,
			contents: messageInput.value
		};
		stompClient.publish({
			destination: "/ws/messages.send",
			body: JSON.stringify(message)
		});
		messageInput.value = "";
	}
	messageInput.addEventListener("keydown", sendMessage);
	messageButton.addEventListener("click", sendMessage);

	conversationList.addEventListener("click", (event) => {
		const button = event.target.closest("button[data-id]");
		if (button) {
			getMessages(button);
		}
	})

	messageList.addEventListener("click", (event) => {
		const button = event.target.closest("button.edit-message");
		if (button) {
			editMessage(button);
		}
	})


	// ==================== FUNCTIONS ====================
	// Retrieve messages for a given conversation
	async function getMessages(element) {
		if (element.getAttribute("data-id") == conversationId) {
			return;
		}
		if(conversationId != null) {
			selectedElement.classList.remove("selected-box");
		}
		selectedElement = element;
		element.classList.add("selected-box");
		conversationId = element.getAttribute("data-id");
		oldestMessageTimestamp = getJavaTime(Date.now());
		hasOlderMessages = true;

		try {
			const cid = conversationId;
			const html = await fetchMessages(conversationId, oldestMessageTimestamp);
			if (cid === conversationId) { // User has not changed conversation
				messageList.innerHTML = html;
				if (messageList.querySelector(".message-wrapper")) {
				 	oldestMessageTimestamp = messageList.querySelector(".message-wrapper").dataset.sentAt;
					oldestMessageId = messageList.querySelector(".message-wrapper").dataset.id;
				}
				scrollHeight = chatScroll.scrollHeight;
				chatScroll.scrollTop = scrollHeight;
				history.pushState({ id: conversationId }, "", `/conversation/${cid}/messages`);
			} else {
				console.log("Conversation changed");
			}
		} catch (error) {
			console.error(error);
		}

		stomp();
	}

	async function getOlderMessages(){
		if (!hasOlderMessages) return;
		try {
			const cid = conversationId;
			const html = await fetchOlderMessages(conversationId, oldestMessageTimestamp, oldestMessageId)
			if (cid == conversationId){ // User has not changed conversation
				const parsed = new DOMParser().parseFromString(html, "text/html");
				if (!parsed.querySelector(".message-wrapper")){
					hasOlderMessages = false;
					return;
				}
				messageList.insertAdjacentHTML("afterbegin", html);
				oldestMessageTimestamp = messageList.querySelector(".message-wrapper").dataset.sentAt;
				oldestMessageId = messageList.querySelector(".message-wrapper").dataset.id;
			} else {
				console.log("Conversation changed");
			}
		} catch (error) {
			console.error(error);
		}
	}

	async function stomp (){
		if (stompClient) {
			await stompClient.deactivate();
		}

		stompClient = new StompJs.Client({
			brokerURL: "ws://localhost:8080/connect",
			debug: function (str) {
				console.log(str);
			},
			reconnectDelay: 3000,
			heartbeatIncoming: 3000,
			heartbeatOutgoing: 3000,
		});

		stompClient.onConnect = function (frame) {
			subscription = stompClient.subscribe("/topic/messages." + conversationId, function (message) {
				const parsedMessage = JSON.parse(message.body);
				if (parsedMessage.event == "send") {
					messageList.appendChild(buildMessage(parsedMessage, userId));
					scrollHeight = chatScroll.scrollHeight;
					chatScroll.scrollTop = scrollHeight;
				} else if (parsedMessage.event == "edit") {
					document.querySelector(`[data-id="${parsedMessage.body.id}"]`).replaceWith(buildMessage(parsedMessage, userId));
				} else if (parsedMessage.event == "delete") {
					document.querySelector(`[data-id="${parsedMessage.body}"]`).remove();
				}
			});
		};

		stompClient.onStompError = function (frame) {
			console.error("error");
		};

		stompClient.activate();
	}

	function editMessage(element) {
		const currentMessage = element.closest(".message--out");
		const childElements = [...currentMessage.children];
		const messageId = currentMessage.closest(".message-wrapper").dataset.id
		const button = currentMessage.querySelector("button");
		const html = buildHTML("input", { type:"text", id:"message", value: currentMessage.querySelector("p").textContent});
		const submitMessageUpdate = (event) => {
			if (!shouldSendOnKeydown(event)) {
				return;
			}
			if (!html.value) { // Delete clause
				const message = messageId;
				stompClient.publish({
					destination: "/ws/messages.delete",
					body: JSON.stringify(message)
				});
			} 
			else { // Update clause
				const message = {
					id: messageId,
					contents: html.value,
				};
				stompClient.publish({
					destination: "/ws/messages.edit",
					body: JSON.stringify(message)
				});
			}
			document.removeEventListener("submit", submitMessageUpdate);
		};
		html.addEventListener("keydown", submitMessageUpdate);
		const restoreMessage = (event) => {
			if (!html.contains(event.target) && !button.contains(event.target)) {
				currentMessage.replaceChildren(...childElements);
				document.removeEventListener("click", restoreMessage);
			}
		};
		document.addEventListener("click", restoreMessage);
		currentMessage.replaceChildren(html);
	}

	async function createConversation(id) {
		try {
			const accountIds = [id];
			const html = await fetchConversation(accountIds);
			conversationList.innerHTML = html;
			selectedElement = conversationList.querySelector(`[data-id="${conversationId}"]`)
			if (selectedElement) { 
				selectedElement.classList.add("selected-box");
			}
			clearSearchResults(searchResults, searchInput);
		}
		catch (error) {
			console.error(error);
		}
	}

	async function getUserId(){
		try {
			return await fetchUserId();
		}
		catch (error) {
			console.error(error);
			return null;
		}
	}
</script>
