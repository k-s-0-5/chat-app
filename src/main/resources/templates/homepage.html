<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
	<head>
		<title>Home</title>
		<link rel="stylesheet" th:href="@{/css/styles.css}">
	</head>
	<body>
		<div class="color" style="width: 100%; height:100%; display: flex; flex-direction: column;">
			
			<header>
				<div style="width: 100px; min-height: 10vh; flex: 1; background-color: blanchedalmond; text-align: center; align-content: center;">
					1
				</div>
				<div style="width: 100px; min-height: 10vh; flex: 1; background-color: beige; text-align: center; align-content: center;">
					2
				</div>
				<div style="width: 100px; min-height: 10vh; flex: 1; background-color: antiquewhite; text-align: center; align-content: center;">
					3
				</div>
			</header>

			<div style="width:80vw; align-self: center; flex: 1;">
				<div style="display: flex; height: 100%;">

					<!-- Conversations lists -->
					<div style="flex: 2; background-color: blanchedalmond;">
						<div th:each="conversation : ${conversations}" style="padding: 7px;">
							<button class="neon-box" onclick="fetchMessages(this)" th:data-id="${conversation.id}">
								<div th:text="${conversation.title}"></div>
								<div th:text="${conversation.lastSent}"></div>
							</button>
						</div>
					</div>

					<!-- Messages -->
					<div id="message-column"style="flex: 4; background-color:beige; display: flex; gap:10px; flex-direction: column; padding: 20px;">
						<div th:fragment="messageList" th:each="message : ${messages}">
							<div class="message-time" th:classappend="${message.accountId == currentUserId} ? 'time--in' : 'time--out'">
								<small th:text="${message.sentAt}"></small>
							</div>
							<div class="message" th:classappend="${message.accountId == currentUserId} ? 'message--in' : 'message--out'">
								<span th:text="${message.contents}" ></span>
							</div>
						</div>
					</div>

					<!-- WIP -->
					<div style="flex: 1; background-color:antiquewhite">
						3
					</div>

				</div>
			</div>
		</div>
	</body>
</html>

<script>
	let conversationId = null;
	function fetchMessages(element) {
		event.preventDefault();

		if(conversationId != null){
			element.classList.remove("selected-box");
		}

		conversationId = element.getAttribute('data-id');
		element.classList.add("selected-box");

		fetch(`/conversation/${conversationId}/messages`)
			.then(response => response.text())
			.then(htmlSnippet => {
				document.getElementById('message-column').innerHTML = htmlSnippet;})
        	.catch(error => console.error('Error:', error));
	}
</script>
